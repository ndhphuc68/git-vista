<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.35" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="85%" stop-color="#0E1726" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Electric Cyan to Royal Blue Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="branchGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Filters for Bloom/Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="246" r="190" fill="url(#centerAura)" />
  <circle cx="256" cy="246" r="115" fill="url(#coreGlow)" />

  <!-- Aperture Outer Ring -->
  <circle cx="256" cy="246" r="162" fill="none" stroke="url(#cyanBlue)" stroke-width="5" stroke-opacity="0.85" filter="url(#neonGlow)" />
  <circle cx="256" cy="246" r="172" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Aperture Blades (8-blade geometric vortex iris) -->
  <g stroke="url(#bladeGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75">
    <!-- Blade 1 (Top) -->
    <path d="M 256 84 C 318 100, 368 152, 386 218 L 322 214" />
    <!-- Blade 2 (Top-Right) -->
    <path d="M 370 132 C 408 184, 412 254, 386 322 L 340 274" />
    <!-- Blade 3 (Right) -->
    <path d="M 418 246 C 402 308, 350 358, 284 376 L 288 312" />
    <!-- Blade 4 (Bottom-Right) -->
    <path d="M 370 360 C 318 398, 248 402, 180 376 L 228 330" />
    <!-- Blade 5 (Bottom) -->
    <path d="M 256 408 C 194 392, 144 340, 126 274 L 190 278" />
    <!-- Blade 6 (Bottom-Left) -->
    <path d="M 142 360 C 104 308, 100 238, 126 170 L 172 218" />
    <!-- Blade 7 (Left) -->
    <path d="M 94 246 C 110 184, 162 134, 228 116 L 224 180" />
    <!-- Blade 8 (Top-Left) -->
    <path d="M 142 132 C 194 94, 264 90, 332 116 L 284 162" />
  </g>

  <!-- Central Git Tree Structure -->
  <!-- Stems & Connections with Neon Glow -->
  <g filter="url(#neonGlow)">
    <!-- Central Main Trunk -->
    <path d="M 256 364 L 256 128" stroke="url(#branchGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Left Branch: curving out then parallel -->
    <path d="M 256 294 C 210 294, 184 262, 184 218 L 184 172" stroke="url(#branchGrad)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Right Branch 1: curving out to primary feature commit -->
    <path d="M 256 326 C 298 326, 328 296, 328 250 L 328 206" stroke="url(#branchGrad)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Right Branch 2 / Rejoin flow: curving up to sub-node -->
    <path d="M 328 250 C 328 190, 362 178, 362 144" stroke="url(#branchGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Git Commit Nodes -->
  <!-- Left Branch Nodes -->
  <circle cx="184" cy="218" r="10" fill="#0E1726" stroke="#00F2FE" stroke-width="5" filter="url(#neonGlow)" />
  <circle cx="184" cy="218" r="4" fill="#FFFFFF" />

  <circle cx="184" cy="172" r="9" fill="#00F2FE" filter="url(#neonGlow)" />
  <circle cx="184" cy="172" r="4" fill="#FFFFFF" />

  <!-- Right Branch Nodes -->
  <circle cx="328" cy="250" r="11" fill="#0E1726" stroke="#38BDF8" stroke-width="5" filter="url(#neonGlow)" />
  <circle cx="328" cy="250" r="4.5" fill="#FFFFFF" />

  <circle cx="328" cy="206" r="9" fill="#00F2FE" filter="url(#neonGlow)" />
  <circle cx="328" cy="206" r="4" fill="#FFFFFF" />

  <circle cx="362" cy="144" r="8" fill="#00F2FE" filter="url(#neonGlow)" />
  <circle cx="362" cy="144" r="3.5" fill="#FFFFFF" />

  <!-- Central Main Trunk Nodes -->
  <!-- Root / Base Node -->
  <circle cx="256" cy="364" r="12" fill="#0E1726" stroke="#2563EB" stroke-width="5.5" filter="url(#neonGlow)" />
  <circle cx="256" cy="364" r="5" fill="#38BDF8" />

  <!-- Mid Merge/Fork Nodes -->
  <circle cx="256" cy="294" r="9" fill="#00F2FE" filter="url(#neonGlow)" />
  <circle cx="256" cy="294" r="4" fill="#FFFFFF" />

  <circle cx="256" cy="218" r="10" fill="#0E1726" stroke="#00F2FE" stroke-width="5" filter="url(#neonGlow)" />
  <circle cx="256" cy="218" r="4" fill="#FFFFFF" />

  <!-- Top Apex / Head Node (The Crown Commit) -->
  <circle cx="256" cy="128" r="14" fill="#00F2FE" filter="url(#softGlow)" />
  <circle cx="256" cy="128" r="10" fill="#FFFFFF" />
  <circle cx="256" cy="128" r="4" fill="#00F2FE" />

  <!-- App Title Brand Mark Typography (GitVista) -->
  <text x="256" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="8" fill="#FFFFFF" text-anchor="middle" opacity="0.95">GITVISTA</text>
  <text x="256" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="8" fill="#00F2FE" text-anchor="middle" opacity="0.35" filter="url(#neonGlow)">GITVISTA</text>
</svg>

